[project]
name = "ma-bench"
version = "1.0.0"
description = "Reference code for MA-Bench: generate, grade and score military mission analysis briefs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ma_bench"]
